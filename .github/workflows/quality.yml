name: EE Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ee-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify EE
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The pull request's own commits are checked below.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            pyproject.toml
      - name: Check commit authors and messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $authors = @(git log --format=%ae "$env:BASE_SHA..$env:HEAD_SHA" | Sort-Object -Unique)
          $others = @($authors | Where-Object { $_ -ne '292889387+Views2k@users.noreply.github.com' })
          if ($others.Count) { throw "Commits in this pull request have other authors: $($others -join ', ')" }
          # Merge commit messages are generated by git and name the merged branches, so only authored ones are read.
          git log --no-merges --format=%B "$env:BASE_SHA..$env:HEAD_SHA" | python -c "import runpy, sys; found = runpy.run_path('tools/check-repository.py')['AI_MARKER'].search(sys.stdin.read()); sys.exit(found and 'A commit message contains: ' + found.group())"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # A pull request that changes only Markdown files and README screenshots gets the repository check alone.
      # docs/API.md is excluded because tests/test_remote_routes.py reads it. The installer is built unless every
      # changed file is a test, documentation, an issue or pull request template, or the Dependabot settings,
      # none of which is packaged. A run started by hand always runs everything.
      - name: Choose the checks for the changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $tests = $true
          $package = $true
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $files = @(git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA")
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if (-not $files.Count) { throw 'The pull request changes no files.' }
            $documents = '\.md$|^docs/screenshots/'
            $unpackaged = "$documents|^tests/|^\.github/ISSUE_TEMPLATE/|^\.github/dependabot\.yml$"
            $tests = [bool]@($files | Where-Object { $_ -notmatch $documents -or $_ -eq 'docs/API.md' }).Count
            $package = [bool]@($files | Where-Object { $_ -notmatch $unpackaged }).Count
            $files | ForEach-Object { "  $_" }
          }
          "Tests: $tests. Installer: $package."
          "tests=$("$tests".ToLower())" >> $env:GITHUB_OUTPUT
          "package=$("$package".ToLower())" >> $env:GITHUB_OUTPUT
      - name: Check the repository files
        if: steps.scope.outputs.tests != 'true'
        run: |
          python tools/check-repository.py --output (Join-Path $env:RUNNER_TEMP 'source-manifest.json')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.scope.outputs.tests == 'true'
        with:
          global-json-file: global.json
      - name: Install pinned dependencies on the hosted runner
        if: steps.scope.outputs.tests == 'true'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
      - name: Restore the desktop program's locked packages
        if: steps.scope.outputs.tests == 'true'
        env:
          AVALONIA_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet restore desktop/EtherlightingEvolved.Native.Check/EtherlightingEvolved.Native.Check.csproj --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify source and simulator workflows
        if: steps.scope.outputs.tests == 'true'
        run: |
          $browser = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          & .\tools\verify.ps1 -PythonExe @(Get-Command python -CommandType Application)[0].Source -BrowserExe $browser -OutputRoot '.\outputs\verification'
      - name: Keep verification results
        if: always() && steps.scope.outputs.tests == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            outputs/verification/*.json
            outputs/verification/*.log
            outputs/verification/*.xml
            outputs/verification/browser/result.json
            outputs/verification/browser/*.png
      - name: Prepare pinned installer compiler
        if: steps.scope.outputs.package == 'true'
        run: .\tools\ci-inno.ps1
      - name: Build and verify the installer
        if: steps.scope.outputs.package == 'true'
        run: |
          & .\packaging\build.ps1 -PythonExe @(Get-Command python -CommandType Application)[0].Source -NodeExe @(Get-Command node -CommandType Application)[0].Source -CompilerExe $env:EE_CI_COMPILER -OutputRoot '.\outputs\candidate'
      - name: Verify the packaged simulator
        if: steps.scope.outputs.package == 'true'
        run: |
          $browser = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          node .\tools\smoke-workspace.mjs --root .\outputs\candidate\dist\EtherlightingEvolved --browser $browser --output .\outputs\candidate\packaged-smoke --port 4198
      - name: Install, verify and uninstall the package
        if: steps.scope.outputs.package == 'true'
        run: |
          $setup = @(Get-ChildItem -Path '.\outputs\candidate\dist' -Filter 'EtherlightingEvolved-Setup-*.exe')
          if ($setup.Count -ne 1) { throw 'Expected one installer.' }
          $target = Join-Path $env:RUNNER_TEMP 'ee-install'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $log = Join-Path $PWD 'outputs\candidate\setup.log'
          $install = Start-Process -FilePath $setup[0].FullName -PassThru -Wait -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$target", '/TASKS=autostart', "/LOG=$log")
          if ($install.ExitCode) { throw "Setup exited with code $($install.ExitCode)." }
          if ($null -eq (Get-ItemProperty -LiteralPath $runKey).'Etherlighting Evolved') { throw 'Setup did not add the sign-in start entry.' }
          python tools/verify-package.py --app $target --node @(Get-Command node -CommandType Application)[0].Source --output outputs/candidate/installed-verification.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The automatic update. The installed app must accept this installer's version information. The silent
          # upgrade it runs, with the same arguments, must find the installation on its own, leave the sign-in
          # start entry as the notification area menu set it, and start the new version, which must quit again.
          dotnet desktop/EtherlightingEvolved.Native.Check/bin/Release/net10.0/EtherlightingEvolved.Native.Check.dll --installer $setup[0].FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-ItemProperty -LiteralPath $runKey -Name 'Etherlighting Evolved'
          $updateLog = Join-Path $PWD 'outputs\candidate\update.log'
          # Start-Process -Wait would also wait for the app that setup starts.
          $update = Start-Process -FilePath $setup[0].FullName -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOCANCEL', '/SP-', '/EEUPDATE', "/LOG=$updateLog")
          $null = $update.Handle
          if (-not $update.WaitForExit(600000)) { throw 'The update did not finish within 10 minutes.' }
          if ($update.ExitCode) { throw "The update exited with code $($update.ExitCode)." }
          if ($null -ne (Get-ItemProperty -LiteralPath $runKey).'Etherlighting Evolved') { throw 'A silent update turned the sign-in start entry back on.' }
          $app = Join-Path $target 'EtherlightingEvolved.exe'
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $started = @(Get-CimInstance Win32_Process -Filter "Name = 'EtherlightingEvolved.exe'" |
              Where-Object { $_.ExecutablePath -eq $app -and $_.CommandLine -match '--after-update' })
            if (-not $started.Count) { Start-Sleep -Seconds 1 }
          } until ($started.Count -or (Get-Date) -gt $deadline)
          if (-not $started.Count) { throw 'The update did not start the new version with --after-update.' }
          $quit = Start-Process -FilePath $app -PassThru -ArgumentList '--quit'
          $null = $quit.Handle
          if (-not $quit.WaitForExit(240000)) { throw 'The updated app did not answer --quit within 4 minutes.' }
          if ($quit.ExitCode) { throw "The updated app did not quit (code $($quit.ExitCode))." }
          $uninstall = Start-Process -FilePath (Join-Path $target 'unins000.exe') -PassThru -Wait -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$(Join-Path $PWD 'outputs\candidate\uninstall.log')")
          if ($uninstall.ExitCode) { throw "The uninstaller exited with code $($uninstall.ExitCode)." }
          # The uninstaller hands over to a copy of itself in a temporary folder and returns at once.
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path -LiteralPath $target) -or $null -ne (Get-ItemProperty -LiteralPath $runKey).'Etherlighting Evolved') {
            if ((Get-Date) -gt $deadline) { throw 'Uninstalling left the app folder or its sign-in start entry.' }
            Start-Sleep -Seconds 1
          }
      - name: Keep candidate diagnostics
        if: always() && steps.scope.outputs.package == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-checks-${{ github.sha }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            outputs/candidate/*.log
            outputs/candidate/package-verification.json
            outputs/candidate/installed-verification.json
            outputs/candidate/packaged-smoke/result.json
            outputs/candidate/packaged-smoke/*.png
      - name: Keep the verified installer
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: EtherlightingEvolved-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: |
            outputs/candidate/dist/EtherlightingEvolved-Setup-*.exe
            outputs/candidate/package-verification.json
            outputs/candidate/packaged-smoke/result.json

  unix-client:
    name: Native client (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install the simulator dependencies
        run: |
          set -euo pipefail
          dotnet --version
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
          .venv/bin/python -m pip check
      - name: Exercise the native pages and editing workflows in the simulator
        run: |
          set -euo pipefail
          project=desktop/EtherlightingEvolved.Native.Check/EtherlightingEvolved.Native.Check.csproj
          dotnet restore "$project" --configfile desktop/NuGet.Config --locked-mode
          dotnet build "$project" -c Release --no-restore
          mkdir -p outputs/native-check
          dotnet desktop/EtherlightingEvolved.Native.Check/bin/Release/net10.0/EtherlightingEvolved.Native.Check.dll --service --output outputs/native-check | tee outputs/native-check/check.log
      - name: Package both supported architectures
        shell: pwsh
        run: |
          $platform = if ($IsMacOS) { 'osx' } else { 'linux' }
          ./desktop/publish.ps1 -Runtime @("$platform-x64", "$platform-arm64") -PythonExe "$PWD/.venv/bin/python"
      - name: Verify the archives and run the native package against a local simulator
        run: |
          set -euo pipefail
          out="$PWD/outputs/native-check/package"
          mkdir -p "$out"
          if [[ "$RUNNER_OS" == macOS ]]; then platform=osx; else platform=linux; fi
          case "$(uname -m)" in x86_64) native=x64 ;; arm64|aarch64) native=arm64 ;; *) exit 1 ;; esac
          shopt -s nullglob
          for arch in x64 arm64; do
            rid="$platform-$arch"
            root="$RUNNER_TEMP/ee-package-$rid"
            mkdir "$root"
            if [[ "$platform" == osx ]]; then
              archives=(outputs/native/EtherlightingEvolved-*-"$rid".zip)
              test "${#archives[@]}" = 1
              unzip -q "${archives[0]}" -d "$root"
              bundle="$root/EtherlightingEvolved.app/Contents"
              plutil -lint "$bundle/Info.plist"
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist")" = EtherlightingEvolved
              test -s "$bundle/Resources/ee.icns"
              folder="$bundle/MacOS"
              notices="$bundle/Resources"
              test -s "$folder/libAvaloniaNative.dylib"
              test -s "$folder/libSkiaSharp.dylib"
              test -s "$folder/libHarfBuzzSharp.dylib"
              cpu=$arch; if [[ "$arch" == x64 ]]; then cpu=x86_64; fi
              lipo "$folder/EtherlightingEvolved" -verify_arch "$cpu"
              for library in libAvaloniaNative.dylib libSkiaSharp.dylib libHarfBuzzSharp.dylib; do
                lipo "$folder/$library" -verify_arch "$cpu"
              done
              codesign --verify --deep --strict --verbose "$root/EtherlightingEvolved.app"
              original="outputs/native/$rid-app/EtherlightingEvolved.app/Contents/MacOS/EtherlightingEvolved"
            else
              archives=(outputs/native/EtherlightingEvolved-*-"$rid".tar.gz)
              test "${#archives[@]}" = 1
              tar -xzf "${archives[0]}" -C "$root"
              folder="$root"
              notices="$folder"
              grep -Fxq 'Exec=EtherlightingEvolved' "$folder/etherlighting-evolved.desktop"
              grep -Fxq 'Icon=etherlighting-evolved' "$folder/etherlighting-evolved.desktop"
              test -s "$folder/etherlighting-evolved.png"
              test -s "$folder/libSkiaSharp.so"
              test -s "$folder/libHarfBuzzSharp.so"
              machine='Advanced Micro Devices X86-64'; if [[ "$arch" == arm64 ]]; then machine=AArch64; fi
              for binary in EtherlightingEvolved libSkiaSharp.so libHarfBuzzSharp.so; do
                readelf -h "$folder/$binary" | grep -Fq "$machine"
              done
              original="outputs/native/$rid/EtherlightingEvolved"
            fi
            test -x "$folder/EtherlightingEvolved"
            cmp "$original" "$folder/EtherlightingEvolved"
            for notice in LICENSE.txt licenses/COMPONENTS.txt licenses/DotNet-LICENSE.txt licenses/DotNet-THIRD-PARTY-NOTICES.txt; do
              test -s "$notices/$notice"
            done
            if [[ "$arch" == "$native" ]]; then client="$folder/EtherlightingEvolved"; fi
          done
          EE_PREVIEW_LIVE=0 EE_PREVIEW_PORT=4196 EE_WORKSPACE_DATA_DIR="$RUNNER_TEMP/ee-demo" node preview/server.mjs > "$out/simulator.log" 2>&1 &
          gateway=$!
          trap 'kill "$gateway" 2>/dev/null || true; wait "$gateway" || true' EXIT
          url=http://127.0.0.1:4196
          curl --silent --show-error --fail --retry 15 --retry-connrefused --retry-delay 1 --max-time 3 "$url/api/session" | python -c 'import json,sys; assert json.load(sys.stdin).get("simulated") is True'
          size=1280x800
          if [[ "$platform" == osx ]]; then
            size=$(swift -e 'import AppKit; guard let screen = NSScreen.main else { fatalError("No desktop display") }; let frame = screen.visibleFrame; print("\(min(1280, Int(frame.width)))x\(min(800, Int(frame.height) - 32))")')
          fi
          echo "Opening the packaged Effects page at $size"
          command=("$client" --url "$url" --shot "$out" --page Effects --size "$size")
          if [[ "$platform" == linux ]]; then command=(xvfb-run -a "${command[@]}"); fi
          if ! python -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=120)' "${command[@]}"; then
            if [[ -f "$out/shot-error.txt" ]]; then cat "$out/shot-error.txt"; fi
            exit 1
          fi
          .venv/bin/python -c 'from PIL import Image; import sys; im=Image.open(sys.argv[1]); assert im.size == tuple(map(int,sys.argv[2].split("x"))) and any(lo < hi for lo,hi in im.convert("RGB").getextrema())' "$out/shot.png" "$size"
      - name: Keep native verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.runner }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            outputs/native-check/check.log
            outputs/native-check/*.png
            outputs/native-check/package/shot.png
            outputs/native-check/package/shot-error.txt
            outputs/native/*.log
      - name: Keep verified desktop client archives
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: EtherlightingEvolved-${{ matrix.runner }}-${{ github.sha }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            outputs/native/EtherlightingEvolved-*-osx-*.zip
            outputs/native/EtherlightingEvolved-*-linux-*.tar.gz
