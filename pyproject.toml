[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etherlighting-evolved"
version = "0.6.2"
description = "Open-source controller for UniFi Etherlighting switches. Unofficial; not affiliated with Ubiquiti."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Views2k" }]
requires-python = ">=3.14"
keywords = ["unifi", "ubiquiti", "etherlighting", "rgb", "led", "switch", "homelab"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "asyncssh>=2.14.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
build = ["pyinstaller>=6", "Pillow>=10"]

[project.scripts]
etherlighting-evolved = "etherlighting_evolved.cli:main"
eectl = "etherlighting_evolved.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etherlighting_evolved = ["resident/*.sh", "resident/*.awk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Body(...) in defaults is the intended style

[tool.ruff.lint.per-file-ignores]
"src/etherlighting_evolved/links.py" = ["E501"]  # a real `swctrl port show` table in the docstring
"tests/test_links.py" = ["E501"]
