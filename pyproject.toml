[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etherlighting-evolved"
version = "0.4.24"
description = "Open-source controller for UniFi Etherlighting switches. Unofficial; not affiliated with Ubiquiti."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Views2k" }]
requires-python = ">=3.11"
keywords = ["unifi", "ubiquiti", "etherlighting", "rgb", "led", "switch", "homelab"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "asyncssh>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
desktop = ["pywebview>=5", "pystray>=0.19", "Pillow>=10"]
build = ["pyinstaller>=6"]

[project.scripts]
etherlighting-evolved = "etherlighting_evolved.cli:main"
eectl = "etherlighting_evolved.cli:main"

[project.gui-scripts]
etherlighting-evolved-app = "etherlighting_evolved.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etherlighting_evolved = ["assets/*", "resident/*.sh", "resident/*.awk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Body(...) in defaults is the intended style

[tool.ruff.lint.per-file-ignores]
"src/etherlighting_evolved/links.py" = ["E501"]  # a real `swctrl port show` table in the docstring
"tests/test_links.py" = ["E501"]
