<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111218">
  <meta name="description" content="Etherlighting Evolved controls UniFi port colors, lighting effects, groups, and rules. An unofficial community project, not affiliated with Ubiquiti.">
  <title>Etherlighting Evolved</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to studio</a>
  <div class="app-window">
    <header class="window-titlebar" hidden>
      <div class="window-controls" role="group" aria-label="Window controls" hidden>
        <button class="window-control light-close" data-window-action="close" aria-label="Close window" title="Close window"><span class="window-dot"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="m2 2 6 6m0-6-6 6"/></svg></span></button>
        <button class="window-control light-minimize" data-window-action="minimize" aria-label="Minimize window" title="Minimize"><span class="window-dot"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6"/></svg></span></button>
        <button class="window-control light-maximize" data-window-action="toggle_maximize" aria-label="Maximize window" title="Maximize"><span class="window-dot"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx=".5"/></svg></span></button>
      </div>
      <div class="window-drag-region pywebview-drag-region"><span class="window-title product-name">Etherlighting Evolved</span></div>
      <img class="window-logo" src="/assets/logo.png" alt="" width="28" height="28">
    </header>
    <div id="app"></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="/src/app.mjs"></script>
</body>
</html>
